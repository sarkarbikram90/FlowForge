[workspace]
resolver = "2"
members = [
    "crates/common",
    "crates/workflow-engine",
    "crates/execution-engine",
    "crates/persistence",
    "crates/messaging",
    "crates/auth",
    "crates/observability",
    "crates/scheduler",
    "crates/worker",
    "crates/api",
    "crates/cli",
    "crates/chaos-tests",
]

[workspace.package]
version = "0.2.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/sarkarbikram90/FlowForge"

[workspace.dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }

# Web framework
axum = { version = "0.7", features = ["macros", "ws"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["cors", "trace", "fs", "timeout"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"

# Database
sqlx = { version = "0.7", features = ["runtime-tokio-rustls", "postgres", "uuid", "chrono", "json", "migrate"] }

# CLI
clap = { version = "4", features = ["derive", "env"] }

# Observability
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
metrics = "0.22"
metrics-exporter-prometheus = "0.14"

# Utilities
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1"
thiserror = "1"
reqwest = { version = "0.12", features = ["json"] }
petgraph = "0.6"
cron = "0.12"
sha2 = "0.10"
rand = "0.8"
parking_lot = "0.12"
async-trait = "0.1"
tokio-util = "0.7"
tokio-stream = "0.1"
whoami = "1.6"
colored = "2.1"
hex = "0.4"
regex = "1.11"
