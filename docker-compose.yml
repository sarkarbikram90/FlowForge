services:
  # ─── Infrastructure ───
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: flowforge
      POSTGRES_PASSWORD: flowforge
      POSTGRES_DB: flowforge
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flowforge"]
      interval: 5s
      timeout: 5s
      retries: 5

  nats:
    image: nats:2.10-alpine
    command: ["-js", "-m", "8222"]
    ports:
      - "4222:4222"
      - "8222:8222"
    volumes:
      - natsdata:/data

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data

  # ─── Platform Services ───
  api:
    build:
      context: .
      target: api
    ports:
      - "8080:8080"
    environment:
      FLOWFORGE_DATABASE_URL: postgres://flowforge:flowforge@postgres:5432/flowforge
      FLOWFORGE_NATS_URL: nats://nats:4222
      API_HOST: "0.0.0.0"
      API_PORT: "8080"
      RUST_LOG: info
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  scheduler:
    build:
      context: .
      target: scheduler
    environment:
      FLOWFORGE_DATABASE_URL: postgres://flowforge:flowforge@postgres:5432/flowforge
      FLOWFORGE_NATS_URL: nats://nats:4222
      SCHEDULER_INTERVAL_SECS: "2"
      RUST_LOG: info
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  worker-1:
    build:
      context: .
      target: worker
    environment:
      FLOWFORGE_DATABASE_URL: postgres://flowforge:flowforge@postgres:5432/flowforge
      FLOWFORGE_NATS_URL: nats://nats:4222
      WORKER_CONCURRENCY: "8"
      WORKER_ID: worker-us-east-01
      RUST_LOG: info
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  worker-2:
    build:
      context: .
      target: worker
    environment:
      FLOWFORGE_DATABASE_URL: postgres://flowforge:flowforge@postgres:5432/flowforge
      FLOWFORGE_NATS_URL: nats://nats:4222
      WORKER_CONCURRENCY: "8"
      WORKER_ID: worker-us-east-02
      RUST_LOG: info
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  ui:
    build:
      context: ./ui
    ports:
      - "3000:80"
    depends_on:
      - api

volumes:
  pgdata:
  natsdata:
  miniodata:
