version: "3.8"

services:
  # ─── Infrastructure ───
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: flowforge
      POSTGRES_PASSWORD: flowforge
      POSTGRES_DB: flowforge
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flowforge"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ─── Application ───
  api:
    build:
      context: .
      target: api
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgres://flowforge:flowforge@postgres:5432/flowforge
      REDIS_URL: redis://redis:6379
      API_HOST: "0.0.0.0"
      API_PORT: "8080"
      RUST_LOG: info
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  scheduler:
    build:
      context: .
      target: scheduler
    environment:
      DATABASE_URL: postgres://flowforge:flowforge@postgres:5432/flowforge
      REDIS_URL: redis://redis:6379
      SCHEDULER_INTERVAL_SECS: "5"
      RUST_LOG: info
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  worker:
    build:
      context: .
      target: worker
    environment:
      DATABASE_URL: postgres://flowforge:flowforge@postgres:5432/flowforge
      REDIS_URL: redis://redis:6379
      WORKER_CONCURRENCY: "4"
      RUST_LOG: info
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      replicas: 2

  worker-2:
    build:
      context: .
      target: worker
    environment:
      DATABASE_URL: postgres://flowforge:flowforge@postgres:5432/flowforge
      REDIS_URL: redis://redis:6379
      WORKER_CONCURRENCY: "4"
      WORKER_ID: worker-2
      RUST_LOG: info
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  ui:
    build:
      context: ./ui
    ports:
      - "3000:80"
    depends_on:
      - api

volumes:
  pgdata:
