<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGlow" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#0E1E38" />
      <stop offset="60%" stop-color="#090D16" />
      <stop offset="100%" stop-color="#05070B" />
    </radialGradient>

    <!-- Cyan/Teal Electric Flow Gradient -->
    <linearGradient id="flowCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#0D9488" />
    </linearGradient>

    <!-- Molten Amber Spark Gradient -->
    <linearGradient id="amberGlow" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#F43F5E" />
    </linearGradient>

    <!-- Anvil Metallic Gradient -->
    <linearGradient id="anvilGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="50%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Glow Filters -->
    <filter id="glowEffect" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="sparkGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="500" height="500" rx="40" fill="url(#bgGlow)" />

  <!-- Subtle DAG Mesh Grid in Background -->
  <g opacity="0.12" stroke="#38BDF8" stroke-width="1" stroke-dasharray="4 4">
    <circle cx="150" cy="140" r="4" fill="#38BDF8" />
    <circle cx="350" cy="140" r="4" fill="#38BDF8" />
    <circle cx="250" cy="90" r="5" fill="#38BDF8" />
    <line x1="150" y1="140" x2="250" y2="90" />
    <line x1="350" y1="140" x2="250" y2="90" />
    <line x1="150" y1="140" x2="250" y2="240" />
    <line x1="350" y1="140" x2="250" y2="240" />
  </g>

  <!-- Forge Core Anvil Base -->
  <g transform="translate(0, 40)">
    <!-- Molten Core Underglow -->
    <ellipse cx="250" cy="220" rx="90" ry="25" fill="url(#amberGlow)" opacity="0.35" filter="url(#glowEffect)" />

    <!-- Anvil Body -->
    <path d="M 160 220 
             L 340 220 
             L 365 245 
             L 320 255 
             L 285 290 
             L 310 325 
             L 190 325 
             L 215 290 
             L 180 255 
             L 135 245 Z"
          fill="url(#anvilGrad)" 
          stroke="url(#flowCyan)" 
          stroke-width="3.5" 
          stroke-linejoin="round"
          filter="url(#glowEffect)" />

    <!-- Anvil Horn Accent -->
    <path d="M 135 245 C 105 240 100 230 115 220 L 160 220 Z" 
          fill="url(#anvilGrad)" 
          stroke="url(#flowCyan)" 
          stroke-width="3" />

    <!-- Isometric Cut / Reflection -->
    <path d="M 190 325 L 215 290 L 285 290 L 310 325 Z" fill="#06B6D4" opacity="0.15" />
    <path d="M 240 220 L 260 220 L 255 255 L 245 255 Z" fill="url(#amberGlow)" opacity="0.8" />
  </g>

  <!-- Upward Dynamic DAG Conduits / Flow Streams -->
  <g filter="url(#glowEffect)">
    <!-- Central Flow Pillar -->
    <path d="M 250 250 L 250 120" stroke="url(#flowCyan)" stroke-width="4.5" stroke-linecap="round" />
    <circle cx="250" cy="115" r="7" fill="#38BDF8" />

    <!-- Left Flow Branch 1 -->
    <path d="M 245 240 C 230 200 190 190 190 140" stroke="url(#flowCyan)" stroke-width="3.5" fill="none" stroke-linecap="round" />
    <circle cx="190" cy="135" r="6" fill="#06B6D4" />

    <!-- Right Flow Branch 1 -->
    <path d="M 255 240 C 270 200 310 190 310 140" stroke="url(#flowCyan)" stroke-width="3.5" fill="none" stroke-linecap="round" />
    <circle cx="310" cy="135" r="6" fill="#06B6D4" />

    <!-- Left Outer Flow Branch 2 -->
    <path d="M 235 250 C 190 230 145 200 145 165" stroke="url(#flowCyan)" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.85" />
    <circle cx="145" cy="160" r="5" fill="#38BDF8" />

    <!-- Right Outer Flow Branch 2 -->
    <path d="M 265 250 C 310 230 355 200 355 165" stroke="url(#flowCyan)" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.85" />
    <circle cx="355" cy="160" r="5" fill="#38BDF8" />

    <!-- Interconnect Cross DAG Edges -->
    <line x1="190" y1="135" x2="250" y2="115" stroke="#38BDF8" stroke-width="2" stroke-dasharray="3 3" opacity="0.7" />
    <line x1="310" y1="135" x2="250" y2="115" stroke="#38BDF8" stroke-width="2" stroke-dasharray="3 3" opacity="0.7" />
  </g>

  <!-- Molten Forge Sparks -->
  <g fill="#F59E0B" filter="url(#sparkGlow)">
    <polygon points="250,225 253,230 258,230 254,234 256,239 250,236 244,239 246,234 242,230 247,230" opacity="0.9" />
    <circle cx="225" cy="215" r="2.5" fill="#F43F5E" />
    <circle cx="278" cy="218" r="2" fill="#F59E0B" />
    <circle cx="240" cy="180" r="1.5" fill="#FBBF24" />
    <circle cx="265" cy="170" r="2" fill="#F43F5E" />
  </g>

  <!-- FlowForge Wordmark -->
  <text x="250" y="415" 
        font-family="'Inter', -apple-system, sans-serif" 
        font-size="42" 
        font-weight="800" 
        letter-spacing="-1" 
        text-anchor="middle" 
        fill="#FFFFFF">
    Flow<tspan fill="#38BDF8">Forge</tspan>
  </text>

  <!-- Subtitle Tagline -->
  <text x="250" y="445" 
        font-family="'JetBrains Mono', monospace" 
        font-size="11" 
        font-weight="600" 
        letter-spacing="2.5" 
        text-anchor="middle" 
        fill="#64748B">
    WORKLOAD ORCHESTRATION
  </text>
</svg>
