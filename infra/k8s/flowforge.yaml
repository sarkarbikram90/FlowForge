apiVersion: v1
kind: Namespace
metadata:
  name: flowforge
---
# PostgreSQL
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: flowforge
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          env:
            - name: POSTGRES_USER
              value: flowforge
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: flowforge-secrets
                  key: postgres-password
            - name: POSTGRES_DB
              value: flowforge
          ports:
            - containerPort: 5432
          volumeMounts:
            - name: pgdata
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: pgdata
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 10Gi
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: flowforge
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
---
# Redis
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: flowforge
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - containerPort: 6379
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: flowforge
spec:
  selector:
    app: redis
  ports:
    - port: 6379
---
# API
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: flowforge
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
        - name: api
          image: flowforge-api:latest
          ports:
            - containerPort: 8080
          env:
            - name: DATABASE_URL
              value: postgres://flowforge:$(POSTGRES_PASSWORD)@postgres:5432/flowforge
            - name: REDIS_URL
              value: redis://redis:6379
            - name: RUST_LOG
              value: info
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: flowforge
spec:
  type: LoadBalancer
  selector:
    app: api
  ports:
    - port: 80
      targetPort: 8080
---
# Scheduler
apiVersion: apps/v1
kind: Deployment
metadata:
  name: scheduler
  namespace: flowforge
spec:
  replicas: 1
  selector:
    matchLabels:
      app: scheduler
  template:
    metadata:
      labels:
        app: scheduler
    spec:
      containers:
        - name: scheduler
          image: flowforge-scheduler:latest
          env:
            - name: DATABASE_URL
              value: postgres://flowforge:$(POSTGRES_PASSWORD)@postgres:5432/flowforge
            - name: REDIS_URL
              value: redis://redis:6379
            - name: RUST_LOG
              value: info
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
---
# Worker
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: flowforge
spec:
  replicas: 3
  selector:
    matchLabels:
      app: worker
  template:
    metadata:
      labels:
        app: worker
    spec:
      containers:
        - name: worker
          image: flowforge-worker:latest
          env:
            - name: DATABASE_URL
              value: postgres://flowforge:$(POSTGRES_PASSWORD)@postgres:5432/flowforge
            - name: REDIS_URL
              value: redis://redis:6379
            - name: WORKER_CONCURRENCY
              value: "4"
            - name: RUST_LOG
              value: info
          resources:
            requests:
              cpu: 200m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
---
apiVersion: v1
kind: Secret
metadata:
  name: flowforge-secrets
  namespace: flowforge
type: Opaque
stringData:
  postgres-password: flowforge-secret-password
