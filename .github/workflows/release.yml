name: FlowForge Release & Distribution

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write
  packages: write
  id-token: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-binaries:
    name: Build Cross-Platform Binaries (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            artifact_name: flowforge-linux-amd64
            archive_ext: tar.gz
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            artifact_name: flowforge-linux-arm64
            archive_ext: tar.gz
            use_cross: true
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            artifact_name: flowforge-windows-amd64
            archive_ext: zip
          - target: x86_64-apple-darwin
            os: macos-latest
            artifact_name: flowforge-darwin-amd64
            archive_ext: tar.gz
          - target: aarch64-apple-darwin
            os: macos-latest
            artifact_name: flowforge-darwin-arm64
            archive_ext: tar.gz

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Stable Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Cross (Locked)
        if: matrix.use_cross
        run: cargo install cross --locked

      - name: Build Release Binaries
        shell: bash
        run: |
          if [ "${{ matrix.use_cross }}" = "true" ]; then
            cross build --release --target ${{ matrix.target }} --workspace
          else
            cargo build --release --target ${{ matrix.target }} --workspace
          fi

      - name: Package Binary Archive (Unix)
        if: matrix.archive_ext == 'tar.gz'
        shell: bash
        run: |
          mkdir -p dist/${{ matrix.artifact_name }}
          cp target/${{ matrix.target }}/release/flowforge-api dist/${{ matrix.artifact_name }}/ || cp target/release/flowforge-api dist/${{ matrix.artifact_name }}/ || true
          cp target/${{ matrix.target }}/release/flowforge-scheduler dist/${{ matrix.artifact_name }}/ || cp target/release/flowforge-scheduler dist/${{ matrix.artifact_name }}/ || true
          cp target/${{ matrix.target }}/release/flowforge-worker dist/${{ matrix.artifact_name }}/ || cp target/release/flowforge-worker dist/${{ matrix.artifact_name }}/ || true
          cp target/${{ matrix.target }}/release/flowforge-cli dist/${{ matrix.artifact_name }}/ || cp target/release/flowforge-cli dist/${{ matrix.artifact_name }}/ || true
          cp README.md LICENSE dist/${{ matrix.artifact_name }}/ || true
          tar -czvf ${{ matrix.artifact_name }}.tar.gz -C dist/${{ matrix.artifact_name }} .

      - name: Package Binary Archive (Windows)
        if: matrix.archive_ext == 'zip'
        shell: pwsh
        run: |
          $dist = "dist\${{ matrix.artifact_name }}"
          New-Item -ItemType Directory -Path $dist -Force | Out-Null
          Copy-Item -Path "target\${{ matrix.target }}\release\*.exe" -Destination $dist -ErrorAction SilentlyContinue
          Copy-Item -Path "target\release\*.exe" -Destination $dist -ErrorAction SilentlyContinue
          Copy-Item -Path "README.md","LICENSE" -Destination $dist -ErrorAction SilentlyContinue
          Compress-Archive -Path "$dist\*" -DestinationPath "${{ matrix.artifact_name }}.zip" -Force

      - name: Upload Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_name }}.${{ matrix.archive_ext }}

  docker-publish:
    name: Build & Push Multi-Arch Container Images
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup QEMU for Multi-Architecture Emulation
        uses: docker/setup-qemu-action@v3

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log into GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and Push Multi-Arch Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  helm-package:
    name: Package & Publish Helm Chart
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Helm
        uses: azure/setup-helm@v4
        with:
          version: "3.14.0"

      - name: Package Helm Chart
        run: |
          mkdir -p dist/helm
          helm package deploy/helm/flowforge --destination dist/helm/
          echo "Packaged Helm chart to dist/helm/"

      - name: Upload Helm Artifact
        uses: actions/upload-artifact@v4
        with:
          name: flowforge-helm-chart
          path: dist/helm/*.tgz

  create-release:
    name: Create GitHub Release
    needs: [build-binaries, docker-publish, helm-package]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download All Release Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Compute SHA256 Checksums
        shell: bash
        run: |
          cd release-artifacts
          find . -type f \( -name "*.tar.gz" -o -name "*.zip" -o -name "*.tgz" \) -exec sha256sum {} + > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish Official GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-artifacts/**/*.tar.gz
            release-artifacts/**/*.zip
            release-artifacts/**/*.tgz
            release-artifacts/SHA256SUMS.txt
          generate_release_notes: true
          draft: false
          prerelease: false
