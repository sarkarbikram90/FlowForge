name: FlowForge E2E & Integration

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  DATABASE_URL: "${{ secrets.E2E_DATABASE_URL || 'postgres://flowforge:flowforge@localhost:5432/flowforge' }}"
  NATS_URL: "${{ secrets.E2E_NATS_URL || 'nats://localhost:4222' }}"
  S3_ENDPOINT: "${{ secrets.E2E_S3_ENDPOINT || 'http://localhost:9000' }}"
  S3_ACCESS_KEY: "${{ secrets.E2E_S3_ACCESS_KEY || 'minioadmin' }}"
  S3_SECRET_KEY: "${{ secrets.E2E_S3_SECRET_KEY || 'minioadmin' }}"
  S3_BUCKET: "${{ secrets.E2E_S3_BUCKET || 'flowforge-artifacts' }}"

jobs:
  integration-tests:
    name: Live Infrastructure Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Stable Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo Dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "flowforge-e2e-cache"

      - name: Start Infrastructure Services (Postgres, NATS JetStream, MinIO)
        run: |
          echo "Starting backing infrastructure via Docker Compose..."
          docker compose up -d postgres nats minio
          
          echo "Waiting for PostgreSQL container to report ready..."
          READY=false
          for i in {1..30}; do
            if docker compose exec -T postgres pg_isready -h 127.0.0.1 -U flowforge; then
              echo "PostgreSQL is ready!"
              READY=true
              break
            fi
            echo "Waiting for PostgreSQL (attempt $i/30)..."
            sleep 1
          done

          if [ "$READY" = "false" ]; then
            echo "PostgreSQL failed to become ready in time. Printing container logs:"
            docker compose logs postgres
            exit 1
          fi

      - name: Apply PostgreSQL Schema Migrations
        run: |
          echo "Applying versioned SQL migrations into postgres container..."
          for migration in $(ls -1 migrations/*.sql | sort); do
            echo "Applying $migration..."
            cat "$migration" | docker compose exec -T -e PGPASSWORD=flowforge postgres psql -h 127.0.0.1 -U flowforge -d flowforge
          done
          echo "Database schema migrations applied successfully!"

      - name: Execute Live Workspace Integration Tests
        run: cargo test --workspace -- --nocapture

      - name: Run Dedicated Chaos and Failover Suite
        run: cargo test -p flowforge-chaos-tests -- --nocapture

      - name: Tear Down Infrastructure
        if: always()
        run: docker compose down -v

  docker-smoke-test:
    name: Production Container Smoke Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Build Unified FlowForge Container Image
        run: docker build -t flowforge-smoke:latest -f Dockerfile .

      - name: Boot FlowForge API Container in Background
        run: |
          docker run -d --name flowforge-smoke-app \
            -p 8080:8080 \
            -e DATABASE_URL=memory \
            flowforge-smoke:latest

      - name: Wait for HTTP Health Probe Ready
        run: |
          echo "Waiting for FlowForge API service to report live..."
          for i in {1..30}; do
            if curl -s -f http://localhost:8080/api/v1/health/live; then
              echo "FlowForge API is LIVE!"
              exit 0
            fi
            echo "Waiting for container startup (attempt $i/30)..."
            sleep 1
          done
          docker logs flowforge-smoke-app
          exit 1

      - name: Query Live System Status Endpoint
        run: |
          curl -s http://localhost:8080/api/v1/health/live | grep "LIVE"
          curl -s http://localhost:8080/api/v1/stats || true

      - name: Clean Up Smoke Test Container
        if: always()
        run: docker rm -f flowforge-smoke-app || true