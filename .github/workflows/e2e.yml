name: FlowForge E2E & Integration

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  DATABASE_URL: "postgres://flowforge:flowforge_secret@localhost:5432/flowforge"
  NATS_URL: "nats://localhost:4222"
  S3_ENDPOINT: "http://localhost:9000"
  S3_ACCESS_KEY: "flowforge_minio"
  S3_SECRET_KEY: "flowforge_minio_secret"
  S3_BUCKET: "flowforge-artifacts"

jobs:
  integration-tests:
    name: Live Infrastructure Integration Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: flowforge
          POSTGRES_PASSWORD: flowforge_secret
          POSTGRES_DB: flowforge
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

      nats:
        image: nats:2.10-alpine
        ports:
          - 4222:4222
          - 8222:8222
        options: >-
          --name nats_server
        args: -js -m 8222

      minio:
        image: minio/minio:latest
        env:
          MINIO_ROOT_USER: flowforge_minio
          MINIO_ROOT_PASSWORD: flowforge_minio_secret
        ports:
          - 9000:9000
          - 9001:9001
        args: server /data --console-address ":9001"

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Stable Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo Dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "flowforge-e2e-cache"

      - name: Apply PostgreSQL Schema Migrations
        run: |
          echo "Applying versioned SQL migrations to live PostgreSQL instance..."
          sudo apt-get update && sudo apt-get install -y postgresql-client
          for migration in $(ls -1 migrations/*.sql | sort); do
            echo "Applying $migration..."
            PGPASSWORD=flowforge_secret psql -h localhost -U flowforge -d flowforge -f "$migration"
          done
          echo "Database schema migrations applied successfully!"

      - name: Execute Live Workspace Integration Tests
        run: cargo test --workspace -- --nocapture

      - name: Run Dedicated Chaos and Failover Suite
        run: cargo test -p flowforge-chaos-tests -- --nocapture

  docker-smoke-test:
    name: Production Container Smoke Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Build Unified FlowForge Container Image
        run: docker build -t flowforge-smoke:latest -f Dockerfile .

      - name: Boot FlowForge API Container in Background
        run: |
          docker run -d --name flowforge-smoke-app \
            -p 8080:8080 \
            -e DATABASE_URL=memory \
            flowforge-smoke:latest

      - name: Wait for HTTP Health Probe Ready
        run: |
          echo "Waiting for FlowForge API service to report live..."
          for i in {1..30}; do
            if curl -s -f http://localhost:8080/api/v1/health/live; then
              echo "FlowForge API is LIVE!"
              exit 0
            fi
            echo "Waiting for container startup (attempt $i/30)..."
            sleep 1
          done
          docker logs flowforge-smoke-app
          exit 1

      - name: Query Live System Status Endpoint
        run: |
          curl -s http://localhost:8080/api/v1/health/live | grep "LIVE"
          curl -s http://localhost:8080/api/v1/stats || true

      - name: Clean Up Smoke Test Container
        if: always()
        run: docker rm -f flowforge-smoke-app || true
